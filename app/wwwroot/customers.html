<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers · KeteOra Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/customers.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="store">
      <span class="logo">K</span>
      <div><strong>KeteOra</strong><small>Wellington</small></div>
    </div>
    <nav>
      <a href="/">Orders</a>
      <a href="/products.html">Products</a>
      <a href="/customers.html">Customers</a>
      <a href="/analytics.html">Analytics</a>
    </nav>
    <div class="release">Release <span class="version" id="release"></span></div>
  </aside>

  <div class="content">
    <header class="page-header">
      <div>
        <div class="company">KeteOra · Order management</div>
        <h1>Customers</h1>
      </div>
      <div class="header-right">
        <input id="search" type="search" placeholder="Search by name, city or email">
        <div class="user">
          <span class="avatar" id="avatar"></span>
          <div><strong id="user-name"></strong><small>Store admin</small></div>
          <button class="logout" id="logout" type="button">Log out</button>
        </div>
      </div>
    </header>

    <section class="panel">
      <table>
        <thead>
          <tr><th>Customer</th><th>Email</th><th>Phone</th><th>Delivery address</th><th>Region</th><th class="num">Orders</th><th class="num">Paid spend</th></tr>
        </thead>
        <tbody id="customers"><tr><td colspan="7" class="empty">Loading customers…</td></tr></tbody>
      </table>
    </section>

    <footer>Served by <span id="server">unknown</span></footer>
  </div>
</body>
</html>
