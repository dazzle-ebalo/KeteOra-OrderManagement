apiVersion: apps/v1
kind: Deployment
metadata:
  name: keteora-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keteora-orders
  template:
    metadata:
      labels:
        app: keteora-orders
    spec:
      containers:
        - name: keteora-orders
          image: keteoraacr.azurecr.io/keteoraorders
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
