# Deploy to Azure Kubernetes Service
# Build and push image to Azure Container Registry; Deploy to Azure Kubernetes Service
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:

  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'a36e44b8-4e28-4491-9527-584a141acffb'
  imageRepository: 'keteoraorders'
  containerRegistry: 'keteoraacr.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'
  imagePullSecret: 'keteoraacre32d-auth'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: CodeScan
  displayName: Code scan stage
  jobs:
  - job: Sonar
    displayName: SonarQube analysis
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        version: '10.x'
    - task: SonarQubePrepare@8
      displayName: Prepare SonarQube analysis
      inputs:
        SonarQube: 'SonarQubeKeteora'
        scannerMode: 'dotnet'
        projectKey: 'keteora-orders'
        projectName: 'KeteOra Orders'
    - task: DotNetCoreCLI@2
      displayName: Build the app for scanning
      inputs:
        command: 'build'
        projects: 'app/KeteOra.Orders.csproj'
    - task: SonarQubeAnalyze@8
      displayName: Run SonarQube analysis
    - task: SonarQubePublish@8
      displayName: Publish quality gate result
      inputs:
        pollingTimeoutSec: '300'

- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - upload: manifests
      artifact: manifests

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'dazzleebaloKeteOraOrderManagement.default'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/manifests/deployment.yml
                $(Pipeline.Workspace)/manifests/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)
