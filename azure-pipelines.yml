# Deploy to Azure Kubernetes Service
# Build and push image to Azure Container Registry; Deploy to Azure Kubernetes Service
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:

  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'a36e44b8-4e28-4491-9527-584a141acffb'
  imageRepository: 'keteoraorders'
  containerRegistry: 'keteoraacr.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'
  imagePullSecret: 'keteoraacre32d-auth'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

  # SonarQube server (the token is a secret pipeline variable, SONAR_TOKEN, never in this file)
  sonarHostUrl: 'http://sonar-keteora-1714.australiaeast.azurecontainer.io:9000'

stages:
- stage: CodeScan
  displayName: Code scan stage
  jobs:
  - job: Sonar
    displayName: SonarQube analysis
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        version: '10.x'
    - script: |
        set -e
        dotnet tool install --global dotnet-sonarscanner
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet sonarscanner begin /k:"keteora-orders" /n:"KeteOra Orders" /d:sonar.host.url="$(sonarHostUrl)" /d:sonar.token="$(SONAR_TOKEN)"
        dotnet build app/KeteOra.Orders.csproj
        dotnet sonarscanner end /d:sonar.token="$(SONAR_TOKEN)"
      displayName: Run SonarQube analysis (SonarScanner for .NET)

- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - upload: manifests
      artifact: manifests

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'dazzleebaloKeteOraOrderManagement.default'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/manifests/deployment.yml
                $(Pipeline.Workspace)/manifests/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)
